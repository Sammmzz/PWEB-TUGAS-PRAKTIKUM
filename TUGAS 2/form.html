<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form MAHASISWA HTML</title>
</head>
<body>
    <h1>Form Mahasiswa</h1>
    <!-- Data Mahasiswa -->
        <fieldset>
        <legend>Data Mahasiswa </legend>
        <form action="#" method="post">
            <table>
                <tr>
                    <td><label for="nama">Nama </label></td>
                    
                    <td>: <input type="text" name="nama"></td>
                </tr>

                <tr>
                    <td><label for="npm">NPM </label></td>
                    <td>: <input type="number" name="npm"></td>
                </tr>
            
                <tr>
                    <td><label for="kelas">Kelas </label></td>
                    <td>: <select name="kelas" id="kelas">
                    <option value="">-</option>
                    <option value="IF_A">IF A</option>
                    <option value="IF_B">IF B</option>
                    <option value="IF_C">IF C</option>
                    <option value="IF_D">IF D</option>
                </select></td>
                </tr>
            
                <tr>
                    <td><label for="jenis_kelamin">Jenis Kelamin </label></td>
                    <td>: <input type="radio" name="jenis_kelamin" value="Pria">Pria
                    <input type="radio" name="jenis_kelamin" value="Wanita">Wanita</td>
                </tr>
                
            </table>
        </fieldset>
    

    <!-- Tempat tinggal Mahasiwa -->
        <fieldset>
        <legend>Tempat Tinggal Mahasiswa </legend>
            <table>
                <tr>
                    <td><label for="alamat">Alamat </label></td>
                    
                    <td>: <textarea name="alamat" id="alamat"></textarea></td>
                </tr>

                <tr>
                    <td><label for="kecamatan">Kecamatan </label></td>
                    <td>: <input type="number" name="kecamatan" ></td>
                </tr>
            
                <tr>
                    <td><label for="kabupaten">Kabupaten / Kotamadya </label></td>
                    <td>: <input type="text" name="kabupaten"></td>
                </tr>
            
                <tr>
                    <td><label for="provinsi">Provinsi </label></td>
                    <td>: <input type="text" name="provinsi"></td>
                </tr>
            
                <tr>
                    <td><label for="kodePos">Kode Pos </label></td>
                    <td>: <input type="number" name="kodePos"></td>
                </tr>
            </table>
            
         </fieldset>

        <!-- lain lainnya -->
        <fieldset>
        <legend>Lain-Lainnya </legend>
        
            <table border="1">
                    <tr>
                        <tr>
                        <td><label for="BahasaPemograman">Bahasa Pemograman</label></td>
                        <td> : <input type="checkbox" name="bahasaPemograman" value="C/C++">C/C++
                            <input type="checkbox" name="bahasaPemograman" value="GoLang">Go Lang
                            <input type="checkbox" name="bahasaPemograman" value="Python">Python 
                            <input type="checkbox" name="bahasaPemograman" value="Lainnya">Lainnya
                        
                                <input type="checkbox" name="bahasaPemograman" value="PHP">PHP
                                <input type="checkbox" name="bahasaPemograman" value="JavaScript">JavaScript
                                <input type="checkbox" name="bahasaPemograman" value="Ruby">Ruby
                            
                        </tr>
                    </tr>
                
                
                <tr>
                    <td><label for="kegiatan">Kegiatan</label></td>
                            <td> :<input type="checkbox" name="kegiatan" value="Organisasi">Organisasi
                            <input type="checkbox" name="kegiatan" value="Kemahasiswaan">Kemahasiswaan
                            <input type="checkbox" name="kegiatan" value="BidangOlahraga">Bidang Olahraga
                            <input type="checkbox" name="kegiatan" value="Lainnya">Lainnya
                            <input type="checkbox" name="kegiatan" value="OrganisasiDiLuarKampus">Organisasi di luar kampus
                            <input type="checkbox" name="kegiatan" value="BidangSeni">Bidang Seni</td>
                </tr>

                

                
            </table>
            
            
        </fieldset>
        <tr>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </tr>
    </form>

</body>
</html>
